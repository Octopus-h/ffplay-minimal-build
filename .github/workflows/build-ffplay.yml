name: Build ffplay (LGPL 精简版) 并发布 Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release 标签 (例如 v1.0.0)，留空则自动生成基于时间的标签'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 MSYS2 (UCRT64 环境)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64          # 从 MINGW64 迁移到 UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-winpthreads
            git
            base-devel
            mingw-w64-ucrt-x86_64-binutils
          # 已移除 yasm，nasm 足以完成 FFmpeg 的汇编检测

      - name: 下载 FFmpeg 源码
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://git.ffmpeg.org/ffmpeg.git ffmpeg
          cd ffmpeg

      - name: 配置编译选项 (UCRT64 路径)
        id: configure
        shell: msys2 {0}
        continue-on-error: true
        run: |
          cd ffmpeg
          export PKG_CONFIG_PATH=/ucrt64/lib/pkgconfig
          prefix=$(cygpath -u "${{ github.workspace }}/ffplay-output")
          ./configure \
            --disable-gpl \
            --enable-small \
            --disable-programs \
            --enable-ffplay \
            --disable-ffmpeg \
            --disable-ffprobe \
            --disable-doc \
            --disable-podpages \
            --disable-manpages \
            --disable-txtpages \
            --disable-htmlpages \
            --extra-cflags="-I/ucrt64/include" \
            --extra-ldflags="-L/ucrt64/lib -lpthread" \
            --disable-everything \
            --enable-avcodec \
            --enable-avformat \
            --enable-avutil \
            --enable-swscale \
            --enable-swresample \
            --enable-protocol=file \
            --enable-demuxer=mov,mp4,mkv,flv,avi \
            --enable-decoder=h264,hevc,mpeg4,vp8,vp9 \
            --enable-decoder=aac,mp3,ac3,eac3 \
            --enable-sdl2 \
            --disable-symver \
            --prefix="$prefix"

      - name: 上传配置日志（如果配置失败）
        if: steps.configure.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-config-log
          path: ffmpeg/ffbuild/config.log

      - name: 如果配置失败，终止工作流
        if: steps.configure.outcome == 'failure'
        run: exit 1

      - name: 编译 ffplay
        id: compile_step
        shell: msys2 {0}
        run: |
          cd ffmpeg
          make -j2 ffplay.exe
          make install

      - name: 收集依赖 DLL + 减小体积
        shell: msys2 {0}
        run: |
          cd $(cygpath -u "${{ github.workspace }}/ffplay-output/bin")
          strip ffplay.exe
          # UCRT64 环境下 DLL 位于 /ucrt64/bin
          ldd ffplay.exe | grep -E "(/ucrt64/bin/.*\.dll)" | awk '{print $3}' | xargs -I {} cp {} .
          ls -lh ffplay.exe

      - name: 生成版本信息 version.txt
        shell: msys2 {0}
        run: |
          cd ffmpeg
          FFMPEG_VER=$(grep '^FFMPEG_VERSION=' ffbuild/config.mak | cut -d'=' -f2-)
          [ -z "$FFMPEG_VER" ] && FFMPEG_VER="unknown"
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          OUT_DIR=$(cygpath -u "${{ github.workspace }}/ffplay-output/bin")

          printf '%s\n' \
            "ffplay 精简版 (LGPL) - UCRT64" \
            "========================================" \
            "FFmpeg 版本 : ${FFMPEG_VER}" \
            "构建时间    : ${BUILD_DATE}" \
            "构建来源    : GitHub Actions" \
            "Commit SHA  : ${{ github.sha }}" \
            "工作流运行  : ${{ github.run_id }} / 第 ${{ github.run_number }} 次" \
            "========================================" \
            "包含功能:" \
            "  - 视频解码 : H.264, HEVC, VP8, VP9, MPEG-4" \
            "  - 音频解码 : AAC, MP3, AC3, EAC3" \
            "  - 容器格式 : MOV, MP4, MKV, FLV, AVI" \
            "  - 额外特性 : 循环播放支持" \
            "许可证      : LGPL（已禁用 GPL 代码）" \
            "运行时      : UCRT (Windows 10+)" \
            "========================================" \
            > "$OUT_DIR/version.txt"

          echo "===== version.txt 内容 ====="
          cat "$OUT_DIR/version.txt"

      - name: 打包产物为ZIP
        shell: pwsh
        run: |
          cd ${{ github.workspace }}/ffplay-output/bin
          Compress-Archive -Path .\* -DestinationPath ..\ffplay-lgpl-minimal-windows.zip

      - name: 上传编译产物 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ffplay-lgpl-minimal
          path: ${{ github.workspace }}/ffplay-output/ffplay-lgpl-minimal-windows.zip

      - name: 创建 Release 并上传附件
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Release ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          body: |
            自动构建的 ffplay 精简版 (LGPL, UCRT64)
            - 包含功能：视频解码 (H.264/HEVC/VP8/VP9/MPEG-4) + 音频解码 (AAC/MP3/AC3) + 循环播放支持
            - 许可证：LGPL（完全禁用 GPL 代码）
            - 运行时：UCRT (Windows 10 及以上)
            - 体积：约 5-8 MB（包含所有依赖DLL）
            - 使用说明：解压后直接运行 ffplay.exe，无需额外安装
            - 详细版本信息见压缩包内的 version.txt
          files: ${{ github.workspace }}/ffplay-output/ffplay-lgpl-minimal-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
