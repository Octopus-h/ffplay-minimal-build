name: Build ffplay (LGPL 精简版) 并发布 Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release 标签 (例如 v1.0.0)，留空则自动生成基于时间的标签'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 MSYS2 (UCRT64 环境)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-winpthreads
            mingw-w64-ucrt-x86_64-git
            base-devel
            mingw-w64-ucrt-x86_64-binutils

      - name: 清理旧产物目录
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "${GITHUB_WORKSPACE}/ffplay-output"
          echo "已清理旧的 ffplay-output 目录"

      - name: 下载 FFmpeg 源码
        shell: msys2 {0}
        run: |
          set -Eeuo pipefail
          git clone --depth 1 https://git.ffmpeg.org/ffmpeg.git ffmpeg
          if [ ! -d ffmpeg/.git ]; then
            echo "::error::FFmpeg 源码克隆失败，目录不存在"
            exit 1
          fi
          cd ffmpeg
          echo "FFmpeg 源码已下载"

      - name: 配置编译选项 (UCRT64 路径)
        id: configure
        shell: msys2 {0}
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          cd ffmpeg
          export PKG_CONFIG_PATH=/ucrt64/lib/pkgconfig
          prefix=$(cygpath -u "${{ github.workspace }}/ffplay-output")
          ./configure \
            --disable-gpl \
            --enable-small \
            --disable-programs \
            --enable-ffplay \
            --disable-ffmpeg \
            --disable-ffprobe \
            --disable-doc \
            --disable-podpages \
            --disable-manpages \
            --disable-txtpages \
            --disable-htmlpages \
            --extra-cflags="-I/ucrt64/include" \
            --extra-ldflags="-L/ucrt64/lib -lpthread" \
            --disable-everything \
            --enable-avcodec \
            --enable-avformat \
            --enable-avutil \
            --enable-swscale \
            --enable-swresample \
            --enable-protocol=file \
            --enable-demuxer=mov,mp4,mkv,flv,avi \
            --enable-decoder=h264,hevc,mpeg4,vp8,vp9 \
            --enable-decoder=aac,mp3,ac3,eac3 \
            --enable-sdl2 \
            --disable-symver \
            --prefix="$prefix"

      - name: 上传配置日志（如果配置失败）
        if: steps.configure.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-config-log
          path: ffmpeg/ffbuild/config.log

      - name: 如果配置失败，终止工作流
        if: steps.configure.outcome == 'failure'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::error::FFmpeg configure 失败，详细日志已上传为 artifact"
          exit 1

      - name: 编译 ffplay
        id: compile_step
        shell: msys2 {0}
        run: |
          set -Eeuo pipefail
          cd ffmpeg
          JOB_COUNT=$(nproc 2>/dev/null || echo 2)
          echo "使用并发数: ${JOB_COUNT}"
          make -j"${JOB_COUNT}" ffplay.exe
          make install

      - name: 收集依赖 DLL + 减小体积
        shell: msys2 {0}
        run: |
          set -Eeuo pipefail
          cd "$(cygpath -u "${{ github.workspace }}/ffplay-output/bin")"
          if [ ! -f ffplay.exe ]; then
            echo "::error::ffplay.exe 未生成，编译可能失败"
            ls -la
            exit 1
          fi
          strip ffplay.exe
          ldd ffplay.exe | grep -E "(/ucrt64/bin/.*\.dll)" | awk '{print $3}' | xargs -I {} cp {} .
          ls -lh ffplay.exe

      - name: 生成版本信息 version.txt
        shell: msys2 {0}
        run: |
          set -Eeuo pipefail
          cd ffmpeg || true
          FFMPEG_VER=$(grep '^FFMPEG_VERSION=' ffbuild/config.mak 2>/dev/null | cut -d'=' -f2-)
          [ -z "$FFMPEG_VER" ] && FFMPEG_VER="unknown"
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          OUT_DIR=$(cygpath -u "$GITHUB_WORKSPACE")/ffplay-output/bin
          mkdir -p "$OUT_DIR"
          echo "OUT_DIR = $OUT_DIR"
          ls -ld "$OUT_DIR"

          printf '%s\n' \
            "ffplay 精简版 (LGPL) - UCRT64" \
            "========================================" \
            "FFmpeg 版本 : ${FFMPEG_VER}" \
            "构建时间    : ${BUILD_DATE}" \
            "构建来源    : GitHub Actions" \
            "Commit SHA  : ${{ github.sha }}" \
            "工作流运行  : ${{ github.run_id }} / 第 ${{ github.run_number }} 次" \
            "========================================" \
            "包含功能:" \
            "  - 视频解码 : H.264, HEVC, VP8, VP9, MPEG-4" \
            "  - 音频解码 : AAC, MP3, AC3, EAC3" \
            "  - 容器格式 : MOV, MP4, MKV, FLV, AVI" \
            "  - 额外特性 : 循环播放支持" \
            "许可证      : LGPL（已禁用 GPL 代码）" \
            "运行时      : UCRT (Windows 10+)" \
            "========================================" \
            > "$OUT_DIR/version.txt"

          echo "===== version.txt 内容 ====="
          cat "$OUT_DIR/version.txt"

      - name: 打包产物为ZIP
        shell: pwsh
        run: |
          $binPath = "${{ github.workspace }}\ffplay-output\bin"
          $zipPath = "${{ github.workspace }}\ffplay-output\ffplay-lgpl-minimal-windows.zip"
          if (-not (Test-Path $binPath)) {
            throw "::error::目标目录不存在: $binPath"
          }
          if (-not (Get-ChildItem -Path $binPath -ErrorAction Stop)) {
            throw "::error::打包目录为空: $binPath"
          }
          Compress-Archive -Path "$binPath\*" -DestinationPath $zipPath -Force

      - name: 检查发布包是否存在
        shell: bash
        run: |
          set -Eeuo pipefail
          zip_file="${GITHUB_WORKSPACE}/ffplay-output/ffplay-lgpl-minimal-windows.zip"
          ls -l "$zip_file"
          if [ ! -f "$zip_file" ]; then
            echo "::error::发布 ZIP 未生成: ${zip_file}"
            exit 1
          fi

      - name: 上传编译产物 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ffplay-lgpl-minimal
          path: ${{ github.workspace }}/ffplay-output/ffplay-lgpl-minimal-windows.zip

      - name: 计算发布标签
        id: release_tag
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.release_tag }}" ]]; then
            tag="${{ github.event.inputs.release_tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="build-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "使用标签: ${tag}"

      - name: 创建 Release 并上传附件
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Release ${{ steps.release_tag.outputs.tag }}
          body: |
            自动构建的 ffplay 精简版 (LGPL, UCRT64)
            - 包含功能：视频解码 (H.264/HEVC/VP8/VP9/MPEG-4) + 音频解码 (AAC/MP3/AC3) + 循环播放支持
            - 许可证：LGPL（完全禁用 GPL 代码）
            - 运行时：UCRT (Windows 10 及以上)
            - 体积：约 5-8 MB（包含所有依赖DLL）
            - 使用说明：解压后直接运行 ffplay.exe，无需额外安装
            - 详细版本信息见压缩包内的 version.txt
          files: ${{ github.workspace }}/ffplay-output/ffplay-lgpl-minimal-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
